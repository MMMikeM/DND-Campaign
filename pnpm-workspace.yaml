dedupePeerDependents: true
packages:
  - packages/*
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@modelcontextprotocol/inspector': true
  # Unused: a stale optional peer of drizzle-orm, left resolved in the lockfile
  # from when react depended on it directly. Never needs its native build.
  better-sqlite3: false
catalog:
  "@types/node": ^26.6.5
  drizzle-orm: 1.0.0-rc.4
  tailwindcss: ^4.0.0
  typescript: ^7.0.2
  zod: ^4.6.7
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
