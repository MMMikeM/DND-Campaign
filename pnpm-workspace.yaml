dedupePeerDependents: true
packages:
  - packages/*
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@modelcontextprotocol/inspector': true
  # Unused: a stale optional peer of drizzle-orm, left resolved in the lockfile
  # from when react depended on it directly. Never needs its native build.
  better-sqlite3: false
catalog:
  "@types/node": ^26.0.0
  drizzle-orm: 1.0.0-rc.4
  tailwindcss: ^4.0.0
  typescript: ^7.0.0
  vitest: 4.1.10
  zod: ^4.0.0
  tsx: ^4.0.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
